name: Claw CI Results

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CI_POLICY_VERSION: v0.3
  PRODUCT_ITERATION: v0.80
  PROJECT_NAME: Claw
  XCODE_PROJECT: Claw.xcodeproj
  XCODE_SCHEME: Claw
  XCODE_DESTINATION: generic/platform=iOS
  RESULT_DIR: ci-results
  RESULT_BUNDLE: ci-results/Claw.xcresult

jobs:
  ci-results:
    name: Build, Smoke, and Package Results
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare result metadata
        id: meta
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          short_sha="${GITHUB_SHA::12}"
          branch_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr '/_ ' '---' | tr -cd 'A-Za-z0-9.-')"
          project_slug="$(printf '%s' "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9.-')"
          artifact_name="${project_slug}-ci-${PRODUCT_ITERATION}-${branch_slug}-${short_sha}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "branch_slug=$branch_slug" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Git diff whitespace check
        id: diff_check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Checking whitespace for the pushed revision."
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              git diff --check HEAD^ HEAD
            else
              git diff --check
            fi
          } 2>&1 | tee "$RESULT_DIR/git-diff-check.log"

      - name: Xcode project plist lint
        id: plist_lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint "$XCODE_PROJECT/project.pbxproj" 2>&1 | tee "$RESULT_DIR/plutil.log"

      - name: Gateway JavaScript syntax check
        id: node_check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            node --check Tools/claw-gateway-server.mjs
            node --check Tools/claw-gateway-direct-smoke.mjs
            node --check Tools/claw-gateway-smoke.mjs
          } 2>&1 | tee "$RESULT_DIR/node-check.log"

      - name: Swift logic smoke
        id: swift_logic_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p .build/SwiftModuleCache
            sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
            xcrun swiftc \
              -swift-version 6 \
              -sdk "$sdk_path" \
              -module-cache-path .build/SwiftModuleCache \
              Claw/Core/*.swift Claw/Services/ClawStore.swift Tools/LogicSmoke.swift \
              -o .build/claw-logic-smoke
            .build/claw-logic-smoke
          } 2>&1 | tee "$RESULT_DIR/swift-logic-smoke.log"

      - name: Gateway direct smoke
        id: gateway_direct_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node Tools/claw-gateway-direct-smoke.mjs 2>&1 | tee "$RESULT_DIR/gateway-direct-smoke.log"

      - name: Swift Gateway event fixture
        id: swift_gateway_fixture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p .build/SwiftFixtureModuleCache
            sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
            xcrun swiftc \
              -swift-version 6 \
              -sdk "$sdk_path" \
              -module-cache-path .build/SwiftFixtureModuleCache \
              Claw/Core/*.swift Tools/ClawGatewayEventFixture.swift \
              -o .build/claw-gateway-event-fixture
            .build/claw-gateway-event-fixture --self-test
          } 2>&1 | tee "$RESULT_DIR/swift-gateway-fixture.log"

      - name: Gateway WebSocket smoke
        id: gateway_websocket_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node Tools/claw-gateway-smoke.mjs 2>&1 | tee "$RESULT_DIR/gateway-websocket-smoke.log"

      - name: Xcode build
        id: xcode_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -showBuildTimingSummary \
            -destination "$XCODE_DESTINATION" \
            -derivedDataPath .derivedData-ci \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RESULT_DIR/xcodebuild.log"

      - name: Mac Catalyst Release build
        id: catalyst_build
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -showBuildTimingSummary \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath .derivedData-catalyst \
            -resultBundlePath "$RESULT_DIR/MacCatalyst.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RESULT_DIR/mac-catalyst-build.log"

      - name: XCTest
        id: xctest
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          : > "$RESULT_DIR/xctest.log"
          {
            echo "Discovering an available iPhone simulator."
            simulator_udid="$(
              xcrun simctl list devices available -j | python3 -c '
            import json, sys
            payload = json.load(sys.stdin)
            for runtime, devices in payload.get("devices", {}).items():
                if "iOS" not in runtime:
                    continue
                for device in devices:
                    if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                        print(device["udid"])
                        raise SystemExit(0)
            raise SystemExit("No available iPhone simulator")
            '
            )"
            echo "Using iPhone simulator $simulator_udid."
            xcrun simctl bootstatus "$simulator_udid" -b
            /usr/bin/xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$simulator_udid" \
              -derivedDataPath .derivedData-tests \
              -resultBundlePath "$RESULT_DIR/ClawTests.xcresult" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 120 \
              CODE_SIGNING_ALLOWED=NO \
              test
            xcrun simctl install "$simulator_udid" .derivedData-tests/Build/Products/Debug-iphonesimulator/Claw.app
            xcrun simctl launch "$simulator_udid" com.claw.prototype
            sleep 2
            xcrun simctl io "$simulator_udid" screenshot "$RESULT_DIR/iphone-workspace.png"
          } 2>&1 | tee -a "$RESULT_DIR/xctest.log"

      - name: iPad XCTest and workspace launch
        id: ipad_xctest
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          : > "$RESULT_DIR/ipad-xctest.log"
          {
            echo "Discovering an available iPad simulator on the cloud runner."
            simulator_udid="$(
              xcrun simctl list devices available -j | python3 -c '
            import json, sys
            payload = json.load(sys.stdin)
            for runtime, devices in payload.get("devices", {}).items():
                if "iOS" not in runtime:
                    continue
                candidates = [device for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPad")]
                candidates.sort(key=lambda device: ("mini" not in device.get("name", "").lower(), device.get("name", "")))
                if candidates:
                    print(candidates[0]["udid"])
                    raise SystemExit(0)
            raise SystemExit("No available iPad simulator")
            '
            )"
            echo "Using iPad simulator $simulator_udid."
            xcrun simctl bootstatus "$simulator_udid" -b
            /usr/bin/xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$simulator_udid" \
              -derivedDataPath .derivedData-tests \
              -resultBundlePath "$RESULT_DIR/ClawIPadTests.xcresult" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 120 \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building
            xcrun simctl install "$simulator_udid" .derivedData-tests/Build/Products/Debug-iphonesimulator/Claw.app
            xcrun simctl launch "$simulator_udid" com.claw.prototype
            sleep 2
            xcrun simctl io "$simulator_udid" screenshot "$RESULT_DIR/ipad-workspace.png"
          } 2>&1 | tee -a "$RESULT_DIR/ipad-xctest.log"

      - name: Write CI manifest and summaries
        id: package_results
        if: always()
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          DIFF_OUTCOME: ${{ steps.diff_check.outcome }}
          PLIST_OUTCOME: ${{ steps.plist_lint.outcome }}
          NODE_OUTCOME: ${{ steps.node_check.outcome }}
          SWIFT_LOGIC_OUTCOME: ${{ steps.swift_logic_smoke.outcome }}
          SWIFT_GATEWAY_FIXTURE_OUTCOME: ${{ steps.swift_gateway_fixture.outcome }}
          GATEWAY_DIRECT_OUTCOME: ${{ steps.gateway_direct_smoke.outcome }}
          GATEWAY_WEBSOCKET_OUTCOME: ${{ steps.gateway_websocket_smoke.outcome }}
          XCODE_BUILD_OUTCOME: ${{ steps.xcode_build.outcome }}
          XCTEST_OUTCOME: ${{ steps.xctest.outcome }}
          CATALYST_BUILD_OUTCOME: ${{ steps.catalyst_build.outcome }}
          IPAD_XCTEST_OUTCOME: ${{ steps.ipad_xctest.outcome }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          from xml.sax.saxutils import escape

          result_dir = Path(os.environ["RESULT_DIR"])
          result_dir.mkdir(parents=True, exist_ok=True)

          checks = [
              ("git-diff-check", os.environ["DIFF_OUTCOME"], "ci-results/git-diff-check.log"),
              ("plutil", os.environ["PLIST_OUTCOME"], "ci-results/plutil.log"),
              ("node-check", os.environ["NODE_OUTCOME"], "ci-results/node-check.log"),
              ("swift-logic-smoke", os.environ["SWIFT_LOGIC_OUTCOME"], "ci-results/swift-logic-smoke.log"),
              ("swift-gateway-fixture", os.environ["SWIFT_GATEWAY_FIXTURE_OUTCOME"], "ci-results/swift-gateway-fixture.log"),
              ("gateway-direct-smoke", os.environ["GATEWAY_DIRECT_OUTCOME"], "ci-results/gateway-direct-smoke.log"),
              ("gateway-websocket-smoke", os.environ["GATEWAY_WEBSOCKET_OUTCOME"], "ci-results/gateway-websocket-smoke.log"),
              ("xcodebuild", os.environ["XCODE_BUILD_OUTCOME"], "ci-results/xcodebuild.log"),
              ("xctest", os.environ["XCTEST_OUTCOME"], "ci-results/xctest.log"),
              ("mac-catalyst-release", os.environ["CATALYST_BUILD_OUTCOME"], "ci-results/mac-catalyst-build.log"),
              ("ipad-xctest", os.environ["IPAD_XCTEST_OUTCOME"], "ci-results/ipad-xctest.log"),
          ]

          xctest_log = result_dir / "xctest.log"
          xctest_result_bundle = result_dir / "ClawTests.xcresult"
          missing_xctest_artifacts = []
          if os.environ["XCTEST_OUTCOME"] == "success":
              if not xctest_log.is_file():
                  missing_xctest_artifacts.append("ci-results/xctest.log")
              if not xctest_result_bundle.is_dir():
                  missing_xctest_artifacts.append("ci-results/ClawTests.xcresult")
              checks.append((
                  "xctest-artifacts",
                  "failure" if missing_xctest_artifacts else "success",
                  "ci-results/xctest.log; ci-results/ClawTests.xcresult",
              ))

          missing_platform_artifacts = []
          for outcome_key, required in [
              ("CATALYST_BUILD_OUTCOME", ["mac-catalyst-build.log", "MacCatalyst.xcresult"]),
              ("IPAD_XCTEST_OUTCOME", ["ipad-xctest.log", "ClawIPadTests.xcresult", "ipad-workspace.png"]),
              ("XCTEST_OUTCOME", ["iphone-workspace.png"]),
          ]:
              if os.environ[outcome_key] == "success":
                  missing_platform_artifacts.extend(name for name in required if not (result_dir / name).exists())
          checks.append(("platform-artifacts", "failure" if missing_platform_artifacts else "success", ", ".join(missing_platform_artifacts) or "ci-results"))

          def aggregate(names):
              selected = [outcome for name, outcome, _ in checks if name in names]
              return "success" if selected and all(outcome == "success" for outcome in selected) else "failure"

          manifest = {
              "version": os.environ["PRODUCT_ITERATION"],
              "ciPolicyVersion": os.environ["CI_POLICY_VERSION"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "commitSha": os.environ["GITHUB_SHA"],
              "shortSha": os.environ["SHORT_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflowName": os.environ["GITHUB_WORKFLOW"],
              "createdAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
              "projectName": os.environ["PROJECT_NAME"],
              "scheme": os.environ["XCODE_SCHEME"],
              "destination": os.environ["XCODE_DESTINATION"],
              "resultBundlePath": os.environ["RESULT_BUNDLE"],
              "xctestLogPath": "ci-results/xctest.log",
              "xctestResultBundlePath": "ci-results/ClawTests.xcresult",
              "xctestArtifactsOutcome": (
                  "failure"
                  if missing_xctest_artifacts
                  else "success"
                  if os.environ["XCTEST_OUTCOME"] == "success"
                  else "retained-failure-log"
              ),
              "junitPath": "ci-results/junit.xml",
              "buildLogPath": "ci-results/xcodebuild.log",
              "failureSummaryPath": "ci-results/ci-failure-summary.md",
              "staticChecksOutcome": aggregate({"git-diff-check", "plutil", "node-check"}),
              "buildOutcome": aggregate({"xcodebuild", "mac-catalyst-release"}),
              "catalystBuildOutcome": os.environ["CATALYST_BUILD_OUTCOME"],
              "ipadTestOutcome": os.environ["IPAD_XCTEST_OUTCOME"],
              "platformArtifactsOutcome": "failure" if missing_platform_artifacts else "success",
              "catalystBuildLogPath": "ci-results/mac-catalyst-build.log",
              "ipadTestLogPath": "ci-results/ipad-xctest.log",
              "ipadTestResultBundlePath": "ci-results/ClawIPadTests.xcresult",
              "workspaceScreenshots": ["ci-results/iphone-workspace.png", "ci-results/ipad-workspace.png"],
              "testOutcome": aggregate({"swift-logic-smoke", "swift-gateway-fixture", "gateway-direct-smoke", "gateway-websocket-smoke", "xctest", "xctest-artifacts", "ipad-xctest", "platform-artifacts"}),
              "projectSpecificReports": [
                  "ci-results/swift-logic-smoke.log",
                  "ci-results/swift-gateway-fixture.log",
                  "ci-results/gateway-direct-smoke.log",
                  "ci-results/gateway-websocket-smoke.log",
                  "ci-results/xctest.log",
                  "ci-results/mac-catalyst-build.log",
                  "ci-results/ipad-xctest.log",
                  "ci-results/node-check.log",
              ],
              "artifactName": os.environ["ARTIFACT_NAME"],
              "checks": [
                  {"name": name, "outcome": outcome, "logPath": log_path}
                  for name, outcome, log_path in checks
              ],
          }

          (result_dir / "ci-artifact-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          failures = [(name, outcome, log_path) for name, outcome, log_path in checks if outcome != "success"]
          lines = [
              "# CI Failure Summary",
              "",
              f"Project: {os.environ['PROJECT_NAME']}",
              f"Branch: {os.environ['GITHUB_REF_NAME']}",
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Run: {os.environ['GITHUB_RUN_ID']} attempt {os.environ['GITHUB_RUN_ATTEMPT']}",
              f"Artifact: {os.environ['ARTIFACT_NAME']}",
              "",
              "| Check | Outcome | Log |",
              "| --- | --- | --- |",
          ]
          lines.extend(f"| {name} | {outcome} | {log_path} |" for name, outcome, log_path in checks)
          lines.append("")
          if failures:
              lines.append("Failing checks:")
              lines.extend(f"- {name}: {outcome}; see {log_path}" for name, outcome, log_path in failures)
          else:
              lines.append("All CI checks passed.")
          (result_dir / "ci-failure-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          testcases = []
          for name, outcome, log_path in checks:
              if outcome == "success":
                  testcases.append(f'    <testcase classname="ClawCI" name="{escape(name)}" />')
              else:
                  testcases.append(
                      f'    <testcase classname="ClawCI" name="{escape(name)}">'
                      f'<failure message="{escape(outcome)}">See {escape(log_path)}</failure>'
                      f'</testcase>'
                  )
          junit = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              f'<testsuite name="Claw CI Results" tests="{len(checks)}" failures="{len(failures)}">',
              *testcases,
              '</testsuite>',
              '',
          ]
          (result_dir / "junit.xml").write_text("\n".join(junit), encoding="utf-8")
          if missing_xctest_artifacts or missing_platform_artifacts:
              raise SystemExit(
                  "Successful checks are missing required result artifacts: "
                  + ", ".join(missing_xctest_artifacts + missing_platform_artifacts)
              )
          PY

      - name: Upload CI result package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ci-results
          if-no-files-found: error
          retention-days: 14

      - name: Fail when any CI check failed
        if: always()
        shell: bash
        env:
          DIFF_OUTCOME: ${{ steps.diff_check.outcome }}
          PLIST_OUTCOME: ${{ steps.plist_lint.outcome }}
          NODE_OUTCOME: ${{ steps.node_check.outcome }}
          SWIFT_LOGIC_OUTCOME: ${{ steps.swift_logic_smoke.outcome }}
          SWIFT_GATEWAY_FIXTURE_OUTCOME: ${{ steps.swift_gateway_fixture.outcome }}
          GATEWAY_DIRECT_OUTCOME: ${{ steps.gateway_direct_smoke.outcome }}
          GATEWAY_WEBSOCKET_OUTCOME: ${{ steps.gateway_websocket_smoke.outcome }}
          XCODE_BUILD_OUTCOME: ${{ steps.xcode_build.outcome }}
          XCTEST_OUTCOME: ${{ steps.xctest.outcome }}
          CATALYST_BUILD_OUTCOME: ${{ steps.catalyst_build.outcome }}
          IPAD_XCTEST_OUTCOME: ${{ steps.ipad_xctest.outcome }}
          PACKAGE_RESULTS_OUTCOME: ${{ steps.package_results.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          outcomes = {
              "git-diff-check": os.environ["DIFF_OUTCOME"],
              "plutil": os.environ["PLIST_OUTCOME"],
              "node-check": os.environ["NODE_OUTCOME"],
              "swift-logic-smoke": os.environ["SWIFT_LOGIC_OUTCOME"],
              "swift-gateway-fixture": os.environ["SWIFT_GATEWAY_FIXTURE_OUTCOME"],
              "gateway-direct-smoke": os.environ["GATEWAY_DIRECT_OUTCOME"],
              "gateway-websocket-smoke": os.environ["GATEWAY_WEBSOCKET_OUTCOME"],
              "xcodebuild": os.environ["XCODE_BUILD_OUTCOME"],
              "xctest": os.environ["XCTEST_OUTCOME"],
              "mac-catalyst-release": os.environ["CATALYST_BUILD_OUTCOME"],
              "ipad-xctest": os.environ["IPAD_XCTEST_OUTCOME"],
              "package-results": os.environ["PACKAGE_RESULTS_OUTCOME"],
          }
          failed = {name: outcome for name, outcome in outcomes.items() if outcome != "success"}
          if failed:
              for name, outcome in failed.items():
                  print(f"{name}: {outcome}")
              sys.exit(1)
          print("All CI checks passed.")
          PY
